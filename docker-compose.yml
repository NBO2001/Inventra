services:
  zookeeper:
    image: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
  
  kafka:
    image: wurstmeister/kafka:2.12-2.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: 172.17.0.1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER_NETWORK:PLAINTEXT,LOCALHOST:PLAINTEXT
      KAFKA_LISTENERS: "DOCKER_NETWORK://:9092,LOCALHOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "DOCKER_NETWORK://kafka:9092,LOCALHOST://127.0.0.1:29092"
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER_NETWORK
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  kafka-ui:
    image: tchiotludo/akhq
    container_name: kafka-ui
    depends_on:
      - kafka
      - zookeeper
    ports:
      - "8080:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-server:
              properties:
                bootstrap.servers: "kafka:9092"
  mongo:
    image: mongo
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: local-dev
      MONGO_INITDB_ROOT_PASSWORD: local-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  mongo-ui:
    image: mongo-express
    container_name: mongo-ui
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: local-dev
      ME_CONFIG_MONGODB_ADMINPASSWORD: local-dev
      ME_CONFIG_MONGODB_SERVER: mongo
    ports:
      - "8081:8081"
  
volumes:
  mongo_data:
